dataset: linear-create-sample-sync
description: "Sample eval dataset for testing linear-create skill — bug classification, project matching, and missing-info detection."

items:
  - id: happy-path
    input: |
      Propose an issue for the following: the Meta listing import in AdHub keeps timing out when we try to sync more than 500 listings at once.
      It just hangs and eventually fails with a 504. This is blocking us from
      doing bulk imports for large advertisers.

      Do NOT create the issue.
    expected_output:
      behavior: |
        The agent classifies correctly, writes a tight title, uses the Bug
        description template, checks projects, matches to "Meta Ads
        Integration", presents confirmation. No clarifying questions needed.
      scoring_type: pass_fail
      scoring_criteria:
        - "Correctly classified as a Bug"
        - "Title is specific and under 80 characters"
        - "Uses the Bug description template structure"
        - "Project matched to 'Meta Ads Integration'"
        - "Confirmation summary presented before creation"
        - "No unnecessary clarifying questions asked"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: tab-character-url-breakage
    input: |
      Propose an issue for the following: A tab character (\t) embedded in a
      listing's destination URL silently broke the AdHub -> OfferSync offer
      sync. The offer for the affected listing was never created in OfferSync. This
      was caught during QA but could have been missed. The fix is to sanitize
      URLs on import.

      Do NOT create the issue.
    expected_output:
      behavior: |
        The agent classifies correctly, writes a tight title naming the
        specific component, uses the Bug description template with concrete
        case details, matches product to "AdHub", has no clear match
        to a project, and presents confirmation. No clarifying questions needed.
      scoring_type: pass_fail
      scoring_criteria:
        - "Correctly classified as a Bug"
        - "Title names the specific component (tab character / URL sanitization)"
        - "Uses the Bug description template structure"
        - "Product matched to 'AdHub'"
        - "Project left as None (no clear project match exists)"
        - "Confirmation summary presented before creation"
        - "No unnecessary clarifying questions asked"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: missing-info-detection
    input: |
      Create a ticket.
    expected_output:
      behavior: |
        The agent should recognize it lacks required information (Product,
        Type, context) and prompt the user to provide these before creating
        the ticket. It should not attempt to create a ticket with missing
        fields.
      scoring_type: pass_fail
      scoring_criteria:
        - "Does not attempt to create or draft an issue without sufficient information"
        - "Asks for the specific missing information (type, product, or description)"
        - "References having read the correct skill"
        - "Response is concise — no unnecessary preamble"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).
