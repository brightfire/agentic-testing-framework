dataset: skill-tester

description: "Skill-tester skill test cases — real runs through inference, confirmation, pre-flight, sync, execute, and report phases. Uses linear-create (brightfire/gpt-skills, PR #417) as the subject skill."

timeout_per_run: 1800  # 30 min - max time to execute all items sequentially

items:
  # ─── Inference + confirmation (stops at confirmation gate) ──────────

  - id: pr-triggered-inference
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        Runs variant inference, resolves refs, and checks for prior experiments via the recency check. It presents a
        confirmation summary with the variant matrix and stops at the confirmation gate — it does not proceed to pre-flight, sync, env setup, or execute.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main@c8269935 (before) vs pr-417@65fbaaee (after)"
        - "Inference: selects single model (agent default, no model comparison requested)"
        - "Inference: selects all dataset items — happy-path, tab-character-url-breakage, missing-info-detection"
        - "Ref Resolution: resolves main to c8269935 and PR head to 65fbaaee (via PR API fallback since branch is deleted)"
        # Phase: Confirmation
        - "Confirmation: presents summary with skill variants, model, dataset items, and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-ab-inference
    input: |
      Branch context:
      - Repo: brightfire/gpt-skills
      - Branch: fbae29ab

      User request: "Run tests for the linear-create skill against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        Runs variant inference with the model dimension added — single skill variant (linear-create@fbae29ab) tested against two models.
        Resolves the commit ref, runs the recency check, and presents a confirmation summary showing 1 skill variant × 2 models = 2 experiments
        (each experiment runs all dataset items with the default repeat count). It stops at the confirmation gate — no further phases run.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill = linear-create from the user request"
        - "Inference: identifies single skill variant — fbae29ab (no A/B, explicit commit hash given)"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: recognizes the full matrix is 1 skill variant × 2 models = 2 experiments"
        - "Inference: selects all dataset items — happy-path, tab-character-url-breakage, missing-info-detection"
        - "Ref Resolution: resolves the commit ref to fbae29ab"
        # Phase: Confirmation
        - "Confirmation: presents summary showing model dimension, experiment count (2), and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).


  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-ab-after-pr-eval
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Now run tests for this skill against glm-5.2 and claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #417 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference and the baseline recency check. It presents a confirmation summary with the variant matrix and stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Confirmation: presents summary reflecting recency results"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-b-only-after-pr-eval
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Now run tests for this skill against claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #417 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with a single model and presents a confirmation summary. It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies single model — claude-sonnet-4-6"
        - "Confirmation: presents summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml)
  - id: skill-and-eval-changed-model-ab
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-and-eval-update
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md, linear-create/eval.yaml

      User request: "Run tests for the linear-create skill against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with the model dimension, notes eval.yaml changed, runs recency check, and presents a confirmation summary.
        It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main vs PR head"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: detects eval.yaml in changed files — both before and after eval versions need syncing"
        - "Confirmation: presents summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Full run (post-confirmation → sync → env setup → execute → report) ────

  # PLACEHOLDER: requires a second linear-create PR to exist (needs A/B: main vs PR head — only works if both have eval.yaml)
  - id: pr-triggered-full-run
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (needs both main and PR head to have eval.yaml).
        # PR #417 only adds eval.yaml — after merge, main has eval.yaml, but a future PR is needed for a meaningful A/B comparison.
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs the full pipeline: inference, confirmation, pre-flight, sync, env setup, execute, and report.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main vs PR head"
        - "Confirmation: skips confirmation (skip confirmation requested in input) and proceeds to pre-flight"
        - "Pre-flight: fetches and scans skill for self-references"
        - "Sync: runs dataset_sync.py with --output-manifest"
        - "Env setup: creates suffixed skill directories"
        - "Execute: invokes eval_harness.py with --repeat 1"
        - "Report: runs eval_report.py and posts results"
        - "Cleanup: removes suffixed skill directories"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: rerun-previous-eval
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main

      User request: "Re-run tests for this skill. Skip confirmation and run each test once. Output the confirmation summary and final report as your response text — do not post them as a comment on the PR."
    expected_output:
      behavior: |
        The agent recognizes the re-run request and skips variant inference — reusing the previous variant spec directly. Ref resolution always runs for branch
        refs, so the agent re-fetches and re-pins all branch refs. Since the PR branch was deleted after merge, the agent uses the PR API fallback to resolve
        the head SHA to 65fbaaee. The recency check runs against the resolved hashes. If all variants already have sufficient existing experiments, the agent
        prunes them from the run matrix and reports that no new runs are needed — proceeding directly to the report phase using existing experiment data. If
        the user forces a re-run, the agent proceeds through pre-flight, sync, env setup, execute (with --repeat 1), and report.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table with variant labels and git refs"
        - "Confirmation: includes Run Matrix with model, variant, status, and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (comparison report — A/B variants)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes Variants table with composite scores per variant"
        - "Report: includes Per-Item Deltas table"
        - "Report: includes Verdict (Improvement, Regression, or Neutral)"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (needs a branch that still exists — #417's branch is deleted)
  - id: rerun-branch-advanced
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main

      User request: "Re-run tests for this skill."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR with a branch that still exists.
        # PR #417's branch was deleted after merge, so branch advancement cannot be tested.
        # The test case structure is preserved for when a suitable PR exists.
        The agent recognizes the re-run request, re-resolves refs, detects the branch has advanced, and proceeds with the updated commit.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: skips variant inference — reuses previous variant spec"
        - "Ref Resolution: re-resolves branch refs and detects the PR head has advanced"
        - "Ref Resolution: updates the variant spec with the new hash"
        - "Confirmation: presents summary with updated PR head hash"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Execute phase ──────────────────────────────────────────────────


  - id: execute-model-ab-slack-triggered
    input: |
      Slack message: "@vashbrightfire Run tests for linear-create against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6 Skip confirmation and run each test once. Output the confirmation summary and final report as your response."
    expected_output:
      behavior: |
        The agent processes the Slack-triggered model A/B test request. It infers: skill = linear-create, models = glm-5.2 and claude-sonnet-4-6,
        branch = main (current HEAD, no PR or branch referenced). The agent runs through all phases: inference, confirmation, pre-flight, sync, env setup,
        execute, and report. During execute, the agent invokes the harness twice — once per model — using the same suffixed skill name (skill unchanged
        between model variants). Both invocations use --repeat 1. The agent posts results back to the Slack channel.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table with variant label and git ref"
        - "Confirmation: includes Run Matrix with both models, variant, status, and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (comparison report — 2 models)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes Variants table with composite scores per model"
        - "Report: includes Per-Item Deltas table"
        - "Report: includes Verdict (Improvement, Regression, or Neutral)"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Pre-flight gate test ───────────────────────────────────────────

  - id: self-reference-abort
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/SKILL.md, linear-create/eval.yaml

      User request: "Run tests for this skill. Skip confirmation and run each test once. Output the confirmation summary and final report as your response text — do not post them as a comment on the PR."
    expected_output:
      behavior: |
        The agent runs inference and confirmation, then proceeds to pre-flight checks. Pre-flight fetches SKILL.md from both git refs (main@c8269935 and
        pr-417@65fbaaee) and scans for self-references. If a self-reference is detected in the skill body (not frontmatter), the agent aborts the entire
        run before syncing anything to Langfuse or setting up the env. It reports which skill and line(s) contain self-references and tells the user to
        fix the source skill before re-running. If no self-references are found, the agent proceeds normally through sync, env setup, execute, and report.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill Variants table with variant labels and git refs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Pre-flight outcome (either path is valid)
        - "Pre-flight: fetches SKILL.md and scans for self-references"
        - "Pre-flight: if self-reference detected — aborts and reports which line(s) contain references"
        - "Pre-flight: if no self-references — proceeds and produces a final report"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Phase-targeted edge cases ────────────────────────────────────────

  - id: new-eval-yaml
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml (new file)

      User request: "Run tests for this skill. Skip confirmation and run each test once. Output the confirmation summary and final report as your response text — do not post them as a comment on the PR."
    expected_output:
      behavior: |
        The agent runs inference, resolves refs (main to c8269935, PR head to 65fbaaee via PR API fallback), and verifies eval.yaml exists at both pinned
        commits. At the base commit (c8269935, before #417 merged), eval.yaml does not exist — the agent excludes the base variant from the matrix (nothing
        to test). Only the after variant (pr-417@65fbaaee) has eval.yaml, so only that variant is included. The agent runs the recency check, presents a
        confirmation summary noting the excluded base variant, skips confirmation (skip confirmation requested in input), and proceeds through sync (after only), env setup,
        execute, and report as a single-variant run.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table noting base variant excluded (no eval.yaml)"
        - "Confirmation: includes Run Matrix with single variant and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (standalone report — single variant)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes Summary table with composite scores and Pass%"
        - "Report: includes Per-Item Scores table"
        - "Report: does NOT include Verdict or Deltas (standalone, no comparison)"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: multi-commit-eval
    input: |
      Repo: brightfire/gpt-skills
      Branch: main
      Skill: linear-create
      eval.yaml path: linear-create/eval.yaml

      User request: "Run tests for the linear-create skill for the past 5 commits on the main branch."
    expected_output:
      behavior: |
        The agent runs variant inference and identifies 5 skill variants — one for each of the last 5 commits on main.
        The variant labels are the short commit hashes. The agent presents the variant summary for confirmation.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies 5 skill variants — one per commit from the last 5 commits on main"
        - "Inference: uses short commit hashes as variant labels"
        - "Confirmation: presents variant summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Report Phase edge cases ───────────────────────────────────────

  - id: report-timeout-partial-scores
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run tests for this skill. Skip confirmation and run each test once. Output the confirmation summary and final report as your response text — do not post them as a comment on the PR."
    expected_output:
      behavior: |
        The agent runs the full pipeline: inference, confirmation, pre-flight, sync, env setup, execute, and report. During the report phase, if
        wait_for_scores.py times out (exit 1, 3-minute timeout) with only partial scores available, the agent proceeds to fetch whatever scores are
        available rather than aborting. It notes the timeout in the report output, runs eval_report.py with the available partial scores, generates a
        verdict based on available deltas, and posts the report. The report explicitly mentions that scoring was incomplete due to a timeout.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table with variant labels and git refs"
        - "Confirmation: includes Run Matrix with model, variant, status, and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (comparison report — 2 variants)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes Variants table with composite scores per variant"
        - "Report: includes Per-Item Deltas table"
        - "Report: includes Verdict (Improvement, Regression, or Neutral)"
        # Timeout-specific
        - "Report: if wait_for_scores.py times out — proceeds with available scores rather than aborting"
        - "Report: notes the timeout in the report output"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: report-single-variant-standalone
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Just run tests for the PR version of linear-create — no need to compare against main. Skip confirmation and run each test once. Output the confirmation summary and final report as your response text — do not post them as a comment on the PR."
    expected_output:
      behavior: |
        The agent recognizes this is a single-variant run (pr-417@65fbaaee only, no baseline comparison). It resolves the PR head to 65fbaaee via the
        PR API fallback, verifies eval.yaml exists at that commit, runs the recency check, and presents a confirmation summary. If confirmed, it proceeds
        through pre-flight, sync (after only), env setup, execute (with --repeat 1), and report. During report, it uses standalone report mode
        (--prefix, not --variants), reports per-item scores and dimension breakdowns, and does NOT generate a verdict, deltas, or improvement suggestions.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table with single variant"
        - "Confirmation: includes Run Matrix with model, variant, status, and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (standalone report — single variant)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes Summary table with composite scores and Pass%"
        - "Report: includes Per-Item Scores table"
        - "Report: does NOT include Verdict or Deltas (standalone, no comparison)"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: report-multi-variant-raw-scores
    input: |
      Repo: brightfire/gpt-skills
      Branch: main
      Skill: linear-create

      User request: "Run tests for the linear-create skill for the past 3 commits on main. Skip confirmation and run each test once. Output the confirmation summary and final report as your response."
    expected_output:
      behavior: |
        The agent recognizes this is a 3-variant run and selects raw score report mode.
      scoring_type: pass_fail
      scoring_criteria:
        # Confirmation format
        - "Confirmation: includes '## Eval Run Summary' heading"
        - "Confirmation: includes Skill, Eval YAML, and Request fields"
        - "Confirmation: includes Skill Variants table with 3 variant labels and git refs"
        - "Confirmation: includes Run Matrix with model, variants, status, and total runs"
        - "Confirmation: proceeds directly to pre-flight without waiting for a reply (skip confirmation)"
        # Report format (raw score report — 3+ variants)
        - "Report: includes '## Eval Results' heading with skill and dataset names"
        - "Report: includes scores per variant (raw score mode)"
        - "Report: does NOT include Verdict, Deltas, or Improvement Suggestions (raw score mode)"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (needs 2 variants — one with scores, one without)
  - id: report-partial-variant-coverage
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (needs 2 variants — one with scores, one without).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs the full pipeline. During the report phase, if one variant is missing scores while the other has scores, the agent notes which
        variant is missing data, proceeds with available data, and produces a partial report.
      scoring_type: pass_fail
      scoring_criteria:
        - "Report: detects that one variant is missing scores while the other has scores"
        - "Report: notes which variant is missing data in the report output"
        - "Report: proceeds with available data rather than aborting"
        - "Report: posts results to the originating channel"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Branch-deletion fallback ──────────────────────────────────────

  - id: branch-deleted-fallback
    input: |
      PR context:
      - Repo: brightfire/gpt-skills
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      Note: The PR branch (claw/vash/add-eval-yaml-linear-create) was deleted after the PR was merged.

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        Runs variant inference (skill A/B: main vs PR head). During ref resolution, it attempts
        `git fetch origin claw/vash/add-eval-yaml-linear-create` which fails (branch deleted after merge). The agent falls back to the PR API:
        `gh api repos/brightfire/gpt-skills/pulls/417 --jq '.head.sha'` and gets `65fbaaee`. It then runs `git fetch origin 65fbaaee` to ensure
        the commit is present locally, and uses `65fbaaee` as the pinned ref for the PR head variant. For the base variant, it resolves main to
        c8269935 normally. The agent verifies eval.yaml exists at both pinned commits (65fbaaee has it, c8269935 does not — base variant excluded
        since PR #417 added eval.yaml). The agent runs the recency check for the after variant and presents a confirmation summary with the
        variant and its pinned hash. It waits for user confirmation — does not proceed to any further phase.
      scoring_type: pass_fail
      scoring_criteria:
        - "Ref Resolution: attempts `git fetch origin claw/vash/add-eval-yaml-linear-create` and detects the failure"
        - "Ref Resolution: falls back to PR API — `gh api repos/brightfire/gpt-skills/pulls/417 --jq '.head.sha'`"
        - "Ref Resolution: correctly resolves head SHA to 65fbaaee"
        - "Ref Resolution: runs `git fetch origin 65fbaaee` to ensure the commit is present locally"
        - "Ref Resolution: uses 65fbaaee as the pinned ref for the PR head variant"
        - "Ref Resolution: resolves base (main) to c8269935 normally"
        - "Ref Resolution: verifies eval.yaml exists at both pinned commits (65fbaaee: yes, c8269935: no — base excluded)"
        - "Confirmation: presents summary with variant and its pinned hash (65fbaaee)"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).
