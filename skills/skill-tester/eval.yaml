dataset: skill-tester

description: "Skill-tester skill test cases — inference, confirmation, sync, execute, and report phases. Uses linear-create (example-org/skill-repo) as the subject skill."

timeout_per_run: 1800  # 30 min — 26 test cases in skill-tester's own dataset

items:
  # ─── Inference + confirmation (stops at confirmation gate) ──────────

  - id: pr-triggered-inference
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run the eval for this PR."
    expected_output:
      behavior: |
        The agent runs variant inference and presents a confirmation summary. It does NOT proceed to pre-flight, sync, or env setup — it waits for the user to confirm or adjust.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main (before) vs PR head (after)"
        - "Inference: selects single model (agent default, no model comparison requested)"
        - "Inference: selects all dataset items (none specifically named)"
        - "Recency: runs baseline recency check — no prior experiments found, so baseline is included"
        # Phase: Confirmation
        - "Confirmation: presents summary with skill variants, model, dataset items, and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-comparison-inference
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Test this branch against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        The agent runs variant inference with the model dimension added, runs the recency check (no prior experiments, so baseline is included), and presents a
        confirmation summary showing the full 2×2 matrix (2 skill variants × 2 models = 4 runs). It waits for confirmation — no further phases run.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main (before) vs branch head (after)"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Recency: runs baseline recency check — no prior experiments found, baseline included for both models"
        - "Inference: recognizes the full matrix is 2 skill variants × 2 models = 4 runs"
        - "Inference: selects all dataset items (none specifically named)"
        # Phase: Confirmation
        - "Confirmation: presents summary showing skill variants, model dimension, total run count (4), and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-comparison-baseline-recent
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      Prior runs: 2 baseline (main) experiments already exist in Langfuse for the linear-create dataset — one for glm-5.2 and one for claude-sonnet-4-6, both created 2 days ago.

      User request: "Test this branch against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        The agent runs variant inference with the model dimension, runs the recency check and finds 2 recent baseline experiments — one per model. It skips the baseline
        variant for both models — only the after (branch head) variant is included. The confirmation summary shows 1 skill variant × 2 models = 2 runs, with baseline status "already
        tested, skipping" for both models.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Recency: runs baseline recency check — finds 2 separate baseline experiments (one per model)"
        - "Recency: skips baseline variant for both models — only after (branch head) is included"
        - "Recency: recognizes the reduced matrix is 1 skill variant × 2 models = 2 runs (not 4)"
        # Phase: Confirmation
        - "Confirmation: presents summary showing only after variant, both models, total run count (2)"
        - "Confirmation: notes baseline status as 'already tested, skipping' for both models"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-comparison-after-pr-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      Prior runs: A previous PR eval was already completed using openrouter/z-ai/glm-5.2 as the single model. Baseline (main) experiment exists in Langfuse for glm-5.2 only,
      created 1 day ago. No baseline experiment exists for claude-sonnet-4-6.

      User request: "Now test this PR against glm-5.2 and claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #101 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference and the baseline recency check. It finds that glm-5.2 was already tested in the prior run (skip). Only claude-sonnet-4-6 needs to run —
        both baseline and PR-head since no prior experiments exist for it. The agent asks for confirmation to proceed with only the new model (claude-sonnet-4-6).
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Recency: recognizes glm-5.2 was already tested in the prior run (skip)"
        - "Recency: recognizes claude-sonnet-4-6 has no prior experiments (include both baseline and PR-head)"
        - "Confirmation: asks user to confirm proceeding with only claude-sonnet-4-6"
        - "Recency: recognizes the matrix is 2 runs: pr-500×claude-sonnet-4-6, main×claude-sonnet-4-6"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-b-only-after-pr-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      Prior runs: A previous PR eval was already completed using openrouter/z-ai/glm-5.2 as the single model. Baseline (main) experiment exists in Langfuse for glm-5.2 only,
      created 1 day ago. No baseline experiment exists for claude-sonnet-4-6.

      User request: "Now test this PR against claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #101 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with a single model (claude-sonnet-4-6), and runs the recency check. It finds no baseline experiment for claude-sonnet-4-6, so the
        baseline variant is included. The confirmation summary shows: main×claude-sonnet-4-6, pr-500×claude-sonnet-4-6 = 2 runs. Baseline status notes claude-sonnet-4-6 as "no
        prior baseline."
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies single model — claude-sonnet-4-6"
        - "Recency: runs baseline recency check — finds no baseline experiment for claude-sonnet-4-6"
        - "Recency: includes baseline variant for claude-sonnet-4-6 (no prior baseline)"
        - "Inference: recognizes the matrix is 2 runs: main×claude-sonnet-4-6, pr-500×claude-sonnet-4-6"
        # Phase: Confirmation
        - "Confirmation: presents summary showing both before and after variants for claude-sonnet-4-6"
        - "Confirmation: shows total run count (2)"
        - "Confirmation: notes baseline status as 'no prior baseline' for claude-sonnet-4-6"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-ab-baseline-missing
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      Prior runs: A previous eval was run as a re-run (after variant only, no baseline). No baseline (main) experiments exist in Langfuse for the linear-create dataset for any model.

      User request: "Test this branch against glm-5.2 and claude-sonnet-4-6."
    expected_output:
      behavior: |
        The agent runs variant inference with the model dimension, and runs the recency check. It finds no baseline experiments for either model, so the baseline variant
        is included for both. The confirmation summary shows the full 2×2 matrix: main×glm-5.2, main×claude-sonnet-4-6, claw-vash-linear-create-model-comparison×glm-5.2,
        claw-vash-linear-create-model-comparison×claude-sonnet-4-6 = 4 runs. Baseline status notes "no prior baseline" for both models.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Recency: runs baseline recency check — finds no baseline experiments for either model"
        - "Recency: includes baseline variant for both models"
        - "Inference: recognizes the full matrix is 2 skill variants × 2 models = 4 runs"
        # Phase: Confirmation
        - "Confirmation: presents summary showing both skill variants for both models"
        - "Confirmation: shows total run count (4)"
        - "Confirmation: notes baseline status as 'no prior baseline' for both models"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml)
  - id: skill-and-eval-changed-model-ab
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-and-eval-update
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md, linear-create/eval.yaml

      User request: "Test this PR against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with the model dimension, and notes that eval.yaml has changed in addition to SKILL.md — meaning both before and after eval versions will
        need syncing (two dataset timestamps). It runs the recency check (no prior experiments, baseline included for both models). The confirmation summary shows the full
        2×2 matrix (2 skill variants × 2 models = 4 runs) and notes that eval.yaml changed, so both eval versions will be synced. It waits for confirmation — no further phases run.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main (before) vs PR head (after)"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: detects that eval.yaml is in the changed files — both before and after eval versions will need syncing"
        - "Recency: runs baseline recency check — no prior experiments found, baseline included for both models"
        - "Inference: recognizes the full matrix is 2 skill variants × 2 models = 4 runs"
        - "Inference: selects all dataset items (none specifically named)"
        # Phase: Confirmation
        - "Confirmation: presents summary showing skill variants, model dimension, total run count (4), and baseline status"
        - "Confirmation: notes that eval.yaml changed — both eval versions will be synced (two dataset timestamps)"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Full run (post-confirmation → sync → env setup) ────────────────

  # PLACEHOLDER: requires a second linear-create PR to exist (needs A/B: main vs PR head — only works if both have eval.yaml, which means post-#101 + a future PR)
  - id: pr-triggered-full-run
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      Inference completed: skill A/B (main vs PR head), single model (agent default), all dataset items. Baseline included (no prior runs). User has confirmed the summary (@vashbrightfire confirm).

      Proceed with the eval.
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (needs both main and PR head to have eval.yaml).
        # PR #101 only adds eval.yaml — after merge, main has eval.yaml, but a future PR is needed for a meaningful A/B comparison.
        # The test case structure is preserved for when a suitable PR exists.
        The agent executes pre-flight checks, sync (both versions), and env setup (both variants). Inference and confirmation are already done — the agent does not re-present a
        confirmation summary.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Pre-flight
        - "Pre-flight: fetches SKILL.md from both git refs via git show"
        - "Pre-flight: scans both skill bodies for self-references"
        - "Pre-flight: passes (no self-references found), proceeds to sync"
        # Phase: Sync
        - "Sync: extracts before eval.yaml from base ref (main) via git show"
        - "Sync: extracts after eval.yaml from PR head ref via git show"
        - "Sync: runs dataset_sync.py sequentially — before then after"
        - "Sync: uses --output-manifest for each sync invocation"
        - "Sync: produces a manifests list with per-variant entries"
        # Phase: Env Setup
        - "Env setup: fetches skill files from both git refs via git show"
        - "Env setup: creates suffixed directories with 7-char git hash plus 4-char random suffix for each variant"
        - "Env setup: copies all skill files preserving subdirectory structure"
        - "Env setup: rewrites the name: field in each copied SKILL.md to match suffixed dir name"
        - "Env setup: lists created suffixed directories with their git ref and label"
        # Phase: Execute
        - "Execute: constructs base experiment name following the <dataset>__<model>__<variant-label>__<git-hash>__<item-scope> convention"
        - "Execute: constructs attestation prefix directing agent to the suffixed skill name from env setup"
        - "Execute: invokes eval_harness.py for each variant with --run-name, --prompt-prefix, --manifest, --repeat 3"
        - "Execute: passes the manifest from the sync phase to pin dataset version"
        - "Execute: runs variants sequentially (not concurrently) by default"
        - "Execute: captures completion status and per-item failures from harness output"
        - "Execute: silent on success — does not post results to any channel (passed to report phase)"
        # Phase: Report
        - "Report: polls for evaluator scores using wait_for_scores.py with both variant prefixes and --since"
        - "Report: runs eval_report.py with --variants, --by-dimension, --json, --threshold, and --since"
        - "Report: parses JSON output and generates a verdict (improvement, regression, or neutral) based on deltas"
        - "Report: generates improvement suggestions for items with significant regressions (delta < -threshold)"
        - "Report: posts results as a comment on PR #500 via gh api"
        - "Report: cleans up suffixed skill directories after posting results"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: rerun-previous-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main

      User request: "Re-run the previous eval for this PR."
      The PR head has not changed since the previous eval. The user confirms they want to force a re-run (@vashbrightfire confirm).
    expected_output:
      behavior: |
        The agent recognizes the re-run request and skips variant inference — reusing the previous variant spec directly. Ref resolution always runs for branch refs, so the
        agent re-fetches and re-pins all branch refs. Since the PR branch was deleted after merge, the agent uses the PR API fallback to resolve the head SHA. The recency
        check runs against the resolved hashes and finds that nothing has changed since the prior run (same commit hash, all variants already tested). The agent indicates
        there are no changes and asks the user to confirm a forced re-run. The user confirms.
        The agent proceeds to pre-flight checks, then syncs all variants that need re-execution (both baseline and after, since the user forced a full re-run). It then sets up the
        env for all requested variants.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference (skipped)
        - "Inference: skips variant inference — reuses previous variant spec"
        - "Ref Resolution: always runs for branch refs — re-fetches and re-pins commit hashes even though this is a rerun"
        - "Ref Resolution: uses PR API fallback for the deleted PR branch to resolve the head SHA"
        - "Recency: runs the recency check against resolved hashes and finds nothing has changed (same commit hash)"
        - "Recency: identifies existing experiments from prior runs — all variants already tested, nothing new to run"
        - "Confirmation: indicates no changes since prior run and asks user to confirm forced re-run"
        - "Confirmation: user confirms — agent proceeds to pre-flight"
        # Phase: Pre-flight
        - "Pre-flight: fetches SKILL.md from both git refs (base + PR head)"
        - "Pre-flight: scans for self-references, passes"
        # Phase: Sync
        - "Sync: syncs all variants for the forced re-run (both before and after versions)"
        - "Sync: uses --output-manifest for both version syncs"
        # Phase: Env Setup
        - "Env setup: creates suffixed directories for all requested variants"
        - "Env setup: copies all files and rewrites name: field"
        # Phase: Execute
        - "Execute: constructs experiment names for all variants in the forced re-run"
        - "Execute: invokes eval_harness.py with --repeat 3 (reduced from default 10 — testing orchestration, not skill quality)"
        - "Execute: captures experiment run names and completion status"
        - "Execute: silent on success — results passed to report phase"
        # Phase: Report
        - "Report: polls for evaluator scores using wait_for_scores.py with both variant prefixes and --since"
        - "Report: runs eval_report.py with --variants, --by-dimension, --json, --threshold, and --since"
        - "Report: parses JSON output and generates a verdict based on deltas"
        - "Report: posts results to the originating channel"
        - "Report: cleans up suffixed skill directories after posting results"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (needs a branch that still exists — #101's branch is deleted)
  - id: rerun-branch-advanced
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main

      User request: "Re-run the previous eval for this PR."
      The previous eval ran against PR head commit a1b2c3d. Since then, the PR branch has advanced — the current PR head is now e5f6g7h (2 new commits pushed to the branch).
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR with a branch that still exists.
        # PR #101's branch (claw/vash/add-eval-yaml-linear-create) was deleted after merge, so branch advancement cannot be tested.
        # The test case structure is preserved for when a suitable PR exists.
        The agent recognizes the re-run request and skips variant inference — reusing the previous variant spec. Ref resolution always runs (for branch refs, regardless of
        whether this is an initial run or a rerun), so the agent re-fetches and re-pins all branch refs. It detects that the PR head has advanced from a1b2c3d to e5f6g7h.
        The agent informs the user that the PR head has advanced from a1b2c3d to e5f6g7h, updates the variant spec with the new hash, and proceeds with the updated commit.
        The recency check runs against the new hash e5f6g7h — since no prior experiments exist for this commit, the new variant is included in the run matrix without needing
        a forced-rerun confirmation. The base variant (main) ref is also re-resolved (its hash may have changed too); its recency check proceeds against the resolved hash.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference (skipped)
        - "Inference: skips variant inference — reuses previous variant spec"
        # Phase: Ref Resolution (always runs for branch refs — initial runs and reruns alike)
        - "Ref Resolution: always runs for branch refs — re-fetches and re-pins commit hashes even though this is a rerun"
        - "Ref Resolution: detects that the PR head has advanced from a1b2c3d to e5f6g7h"
        - "Ref Resolution: informs the user that the PR head has advanced from a1b2c3d to e5f6g7h"
        - "Ref Resolution: updates the variant spec with the new hash e5f6g7h (does NOT reuse the stale hash a1b2c3d)"
        # Phase: Recency Check
        - "Recency: runs recency check against the new hash e5f6g7h (not the old hash a1b2c3d)"
        - "Recency: new variant (e5f6g7h) has no prior experiments — included in the run matrix"
        - "Recency: does NOT ask the user to confirm a forced re-run (the new hash is a genuinely new variant)"
        # Phase: Confirmation
        - "Confirmation: presents summary with updated PR head hash (e5f6g7h) and notes the branch advancement"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Execute phase edge cases ──────────────────────────────────────

  - id: execute-harness-crash
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      Inference, confirmation, pre-flight, sync, and env setup all completed successfully. The user confirmed the eval.

      During the execute phase, the first harness invocation (variant A / main) crashed with exit code 1 and a Python traceback — the harness hit an
      unexpected error while spawning the `openclaw agent` subprocess for the first dataset item. The second variant (pr-101) has not yet been attempted.
    expected_output:
      behavior: |
        The agent detects the harness crash from the non-zero exit code. It immediately reports the failure to the originating channel as an error
        notification — including which variant failed, the error message, and the experiment name. It does NOT wait for the report phase. It then
        continues with the remaining variant (pr-101) rather than aborting the entire execute phase, since the failure is variant-specific (not systemic).
      scoring_type: pass_fail
      scoring_criteria:
        - "Execute: detects harness crash from non-zero exit code"
        - "Execute: reports failure to originating channel immediately (does not wait for report phase)"
        - "Execute: error notification includes variant label, error message, and experiment name"
        - "Execute: invokes harness with --repeat 3 (reduced from default 10 — testing orchestration, not skill quality)"
        - "Execute: continues with remaining variant rather than aborting entirely"
        - "Execute: does not treat a single variant failure as a reason to skip remaining variants"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: execute-all-items-failed
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      Inference, confirmation, pre-flight, sync, and env setup all completed. The user confirmed the eval.

      During the execute phase, the harness exited with code 1 because all dataset items failed — the summary shows "Total failures: 3" with 0 successful
      items. This happened for both variants.
    expected_output:
      behavior: |
        The agent recognizes that all items failed across all variants — this is an execution failure, not a partial failure. It reports the failure
        to the originating channel immediately as an error notification, including the total failure count and the affected variants. It does not
        proceed to the report phase with empty results.
      scoring_type: pass_fail
      scoring_criteria:
        - "Execute: recognizes all-items-failed as an execution failure (not partial failure)"
        - "Execute: reports immediately to originating channel (does not wait for report phase)"
        - "Execute: invokes harness with --repeat 3 (reduced from default 10 — testing orchestration, not skill quality)"
        - "Execute: error notification includes total failure count and affected variants"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: execute-partial-failure
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      Inference, confirmation, pre-flight, sync, and env setup all completed. The user confirmed the eval.

      During the execute phase, the harness completed (exit 0) for both variants. Variant A (main) had 1 failed item out of 3. Variant B (pr-101)
      had 0 failed items. The harness summary shows "Total failures: 1" for variant A.
    expected_output:
      behavior: |
        The agent recognizes that partial failures (some items failed, but harness completed with exit 0) are NOT an immediate error condition. It
        captures the per-item failures as part of the execute phase output and passes them to the report phase. It does not send an immediate error
        notification — the report phase handles per-item failure analysis.
      scoring_type: pass_fail
      scoring_criteria:
        - "Execute: recognizes partial failures (some items failed, harness exit 0) as NOT an immediate error"
        - "Execute: captures per-item failures in the structured output"
        - "Execute: does NOT send an immediate error notification to the originating channel"
        - "Execute: invokes harness with --repeat 3 (reduced from default 10 — testing orchestration, not skill quality)"
        - "Execute: passes failure details to the report phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: execute-model-ab-slack-triggered
    input: |
      Slack-triggered model A/B test. The user wants to compare openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6 for the linear-create skill.

      Inference, confirmation, pre-flight, sync, and env setup all completed. The user confirmed the eval. Env setup created a single suffixed skill
      directory (skill unchanged between model variants).
    expected_output:
      behavior: |
        The agent invokes the harness twice — once with --model openrouter/z-ai/glm-5.2 and once with --model anthropic/claude-sonnet-4-6. Both
