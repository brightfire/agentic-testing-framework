  # ─── Branch-deletion fallback ──────────────────────────────────────

  - id: branch-deleted-fallback
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      Note: The PR branch (claw/vash/add-eval-yaml-linear-create) was deleted after the PR was merged.

      User request: "Run the eval for this PR."
    expected_output:
      behavior: |
        The agent runs variant inference (skill A/B: main vs PR head). During ref resolution, it attempts `git fetch origin claw/vash/add-eval-yaml-linear-create` which fails
        (branch deleted after merge). The agent falls back to the PR API: `gh api repos/example-org/skill-repo/pulls/101 --jq '.head.sha'` and gets `aaaaaaa`. It then runs
        `git fetch origin aaaaaaa` to ensure the commit is present locally, and uses `aaaaaaa` as the pinned ref for the PR head variant. For the base variant, it resolves
        `main` normally. The agent verifies eval.yaml exists at both pinned commits. The agent runs the recency check (no prior experiments, both included) and presents a
        confirmation summary with both variants and their pinned hashes. It waits for user confirmation — does not proceed to any further phase.
      scoring_type: pass_fail
      scoring_criteria:
        - "Ref Resolution: attempts `git fetch origin claw/vash/add-eval-yaml-linear-create` and detects the failure"
        - "Ref Resolution: falls back to PR API — `gh api repos/example-org/skill-repo/pulls/101 --jq '.head.sha'`"
        - "Ref Resolution: correctly resolves head SHA to aaaaaaa"
        - "Ref Resolution: runs `git fetch origin aaaaaaa` to ensure the commit is present locally"
        - "Ref Resolution: uses aaaaaaa as the pinned ref for the PR head variant"
        - "Ref Resolution: resolves base (main) ref normally"
        - "Ref Resolution: verifies eval.yaml exists at both pinned commits"
        - "Confirmation: presents summary with both variants and their pinned hashes"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

