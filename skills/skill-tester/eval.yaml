dataset: skill-tester

description: "Skill-tester skill test cases — real runs through inference, confirmation, pre-flight, sync, execute, and report phases. Uses linear-create (example-org/skill-repo, PR #101) as the subject skill."

timeout_per_run: 1800  # 30 min - max time to execute all items sequentially

items:
  # ─── Inference + confirmation (stops at confirmation gate) ──────────

  - id: pr-triggered-inference
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        Runs variant inference, resolves refs, and checks for prior experiments via the recency check. It presents a
        confirmation summary with the variant matrix and stops at the confirmation gate — it does not proceed to pre-flight, sync, env setup, or execute.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main@bbbbbbb (before) vs pr-101@aaaaaaa (after)"
        - "Inference: selects single model (agent default, no model comparison requested)"
        - "Inference: selects all dataset items — happy-path, tab-character-url-breakage, missing-info-detection"
        - "Ref Resolution: resolves main to bbbbbbb and PR head to aaaaaaa (via PR API fallback since branch is deleted)"
        - "Recency: runs baseline recency check against Langfuse"
        # Phase: Confirmation
        - "Confirmation: presents summary with skill variants, model, dataset items, and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-ab-inference
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main

      User request: "Run tests for this skill against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        Runs variant inference with the model dimension added, resolves refs, runs the recency check, and presents a
        confirmation summary showing the full 2×2 matrix (2 skill variants × 2 models = 4 runs). It stops at the confirmation gate — no further phases run.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill A/B — main (before) vs branch (after)"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: recognizes the full matrix is 2 skill variants × 2 models = 4 runs"
        - "Inference: selects all dataset items — happy-path, tab-character-url-breakage, missing-info-detection"
        - "Ref Resolution: resolves main ref to bbbbbbb and branch head ref to commit hash"
        - "Recency: runs baseline recency check against Langfuse"
        # Phase: Confirmation
        - "Confirmation: presents summary showing skill variants, model dimension, total run count (4), and baseline status"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
        - "Confirmation: does not run pre-flight, sync, or env setup"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-ab-baseline-recent
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main

      User request: "Run tests for this skill against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        Runs variant inference with the model dimension, resolves refs, and runs the recency check. If prior baseline
        experiments exist for both models, it skips the baseline variant for both and presents a summary showing only the after variant: 1 skill variant ×
        2 models = 2 runs. If no prior baseline experiments exist, it includes the baseline variant for both and presents the full 2×2 matrix = 4 runs.
        It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Ref Resolution: resolves main ref to bbbbbbb and branch head ref to commit hash"
        - "Recency: runs baseline recency check against Langfuse for both models"
        - "Recency: if prior baseline experiments exist — skips baseline variant, recognizes reduced matrix is 1 skill variant × 2 models = 2 runs"
        - "Recency: if no prior baseline experiments exist — includes baseline variant, full matrix is 2 skill variants × 2 models = 4 runs"
        # Phase: Confirmation
        - "Confirmation: presents summary reflecting actual recency results (2 or 4 runs)"
        - "Confirmation: notes baseline status correctly based on recency check results"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: model-ab-baseline-missing
    input: |
      Branch context:
      - Repo: example-org/skill-repo
      - Branch: claw/vash/linear-create-model-comparison
      - Base branch: main

      User request: "Run tests for this skill against glm-5.2 and claude-sonnet-4-6."
    expected_output:
      behavior: |
        Runs variant inference with the model dimension, resolves refs, and runs the recency check. If no prior
        baseline experiments exist for either model, the baseline variant is included for both. The confirmation summary shows the full 2×2 matrix: 2 skill
        variants × 2 models = 4 runs, with baseline status "no prior baseline". If prior baseline experiments do exist, the agent correctly skips them.
        It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Ref Resolution: resolves main ref to bbbbbbb and branch head ref to commit hash"
        - "Recency: runs baseline recency check — correctly handles whether or not prior experiments exist"
        - "Recency: if no prior experiments — includes baseline variant for both models, recognizes full matrix is 4 runs"
        - "Recency: if prior experiments exist — skips baseline variant, recognizes reduced matrix"
        # Phase: Confirmation
        - "Confirmation: presents summary showing correct variant matrix based on recency results"
        - "Confirmation: shows correct total run count (2 or 4)"
        - "Confirmation: notes baseline status correctly"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-ab-after-pr-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Now run tests for this skill against glm-5.2 and claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #101 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference and the baseline recency check. It presents a confirmation summary with the variant matrix and stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Recency: runs baseline recency check for both models"
        - "Confirmation: presents summary reflecting recency results"
        - "Confirmation: waits for user confirmation — does not proceed to any further phase"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that modifies the skill, not just adds eval.yaml)
  - id: model-b-only-after-pr-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Now run tests for this skill against claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (PR #101 only adds eval.yaml, not SKILL.md changes).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with a single model and presents a confirmation summary. It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies single model — claude-sonnet-4-6"
        - "Recency: runs baseline recency check"
        - "Confirmation: presents summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml)
  - id: skill-and-eval-changed-model-ab
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-and-eval-update
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md, linear-create/eval.yaml

      User request: "Run tests for this skill against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (a future PR that changes both SKILL.md and eval.yaml).
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs variant inference with the model dimension, notes eval.yaml changed, runs recency check, and presents a confirmation summary.
        It stops at the confirmation gate.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main vs PR head"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: detects eval.yaml in changed files — both before and after eval versions need syncing"
        - "Confirmation: presents summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Full run (post-confirmation → sync → env setup → execute → report) ────

  # PLACEHOLDER: requires a second linear-create PR to exist (needs A/B: main vs PR head — only works if both have eval.yaml)
  - id: pr-triggered-full-run
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main
      - Files changed: linear-create/SKILL.md

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR to exist (needs both main and PR head to have eval.yaml).
        # PR #101 only adds eval.yaml — after merge, main has eval.yaml, but a future PR is needed for a meaningful A/B comparison.
        # The test case structure is preserved for when a suitable PR exists.
        The agent runs the full pipeline: inference, confirmation, pre-flight, sync, env setup, execute, and report.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main vs PR head"
        - "Confirmation: presents summary and waits for confirmation"
        - "Pre-flight: fetches and scans skill for self-references"
        - "Sync: runs dataset_sync.py with --output-manifest"
        - "Env setup: creates suffixed skill directories"
        - "Execute: invokes eval_harness.py with --repeat 3"
        - "Report: runs eval_report.py and posts results"
        - "Cleanup: removes suffixed skill directories"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: rerun-previous-eval
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main

      User request: "Re-run tests for this skill."
    expected_output:
      behavior: |
        The agent recognizes the re-run request and skips variant inference — reusing the previous variant spec directly. Ref resolution always runs for branch
        refs, so the agent re-fetches and re-pins all branch refs. Since the PR branch was deleted after merge, the agent uses the PR API fallback to resolve
        the head SHA to aaaaaaa. The recency check runs against the resolved hashes. If all variants already have sufficient existing experiments, the agent
        prunes them from the run matrix and reports that no new runs are needed — proceeding directly to the report phase using existing experiment data. If
        the user forces a re-run, the agent proceeds through pre-flight, sync, env setup, execute (with --repeat 3), and report.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference (skipped)
        - "Inference: skips variant inference — reuses previous variant spec"
        - "Ref Resolution: re-fetches and re-pins commit hashes (always runs for branch refs)"
        - "Ref Resolution: uses PR API fallback for deleted branch — resolves head SHA to aaaaaaa"
        - "Recency: runs recency check against resolved hashes"
        - "Recency: if existing experiments found — prunes them, does NOT re-run, proceeds to report with existing data"
        - "Recency: if user forces re-run — proceeds to pre-flight, sync, env setup, execute, report"
        # Phase: Execute (if runs are needed)
        - "Execute: invokes eval_harness.py with --repeat 3"
        # Phase: Report
        - "Report: generates report from existing or new experiment data"
        - "Report: posts results to the originating channel"
        - "Cleanup: removes suffixed skill directories"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (needs a branch that still exists — #101's branch is deleted)
  - id: rerun-branch-advanced
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/skill-improvement
      - PR number: 500
      - Base branch: main

      User request: "Re-run tests for this skill."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires a second linear-create PR with a branch that still exists.
        # PR #101's branch was deleted after merge, so branch advancement cannot be tested.
        # The test case structure is preserved for when a suitable PR exists.
        The agent recognizes the re-run request, re-resolves refs, detects the branch has advanced, and proceeds with the updated commit.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: skips variant inference — reuses previous variant spec"
        - "Ref Resolution: re-resolves branch refs and detects the PR head has advanced"
        - "Ref Resolution: updates the variant spec with the new hash"
        - "Recency: runs recency check against the new hash"
        - "Confirmation: presents summary with updated PR head hash"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Execute phase ──────────────────────────────────────────────────

  - id: execute-partial-failure
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        The agent runs the full pipeline: inference, confirmation, pre-flight, sync, env setup, execute, and report. During the execute phase, if some items
        fail but the harness completes (exit 0), the agent recognizes this as a partial failure — not an immediate error condition. It captures the per-item
        failures as part of the execute phase output and passes them to the report phase. It does not send an immediate error notification — the report phase
        handles per-item failure analysis.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main@bbbbbbb vs pr-101@aaaaaaa"
        - "Ref Resolution: resolves main to bbbbbbb and PR head to aaaaaaa (via PR API fallback)"
        - "Confirmation: presents summary and waits for confirmation"
        - "Pre-flight: fetches and scans skill for self-references"
        - "Sync: runs dataset_sync.py with --output-manifest"
        - "Env setup: creates suffixed skill directories for both variants"
        - "Execute: invokes eval_harness.py with --repeat 3 for each variant"
        - "Execute: if partial failures occur (some items fail, harness exit 0) — recognizes as NOT an immediate error"
        - "Execute: captures per-item failures in structured output"
        - "Execute: does NOT send immediate error notification for partial failures"
        - "Execute: passes failure details to the report phase"
        - "Report: runs eval_report.py with available scores"
        - "Report: posts results to the originating channel"
        - "Cleanup: removes suffixed skill directories"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: execute-model-ab-slack-triggered
    input: |
      Slack message: "@vashbrightfire Run tests for linear-create against openrouter/z-ai/glm-5.2 and anthropic/claude-sonnet-4-6"
    expected_output:
      behavior: |
        The agent processes the Slack-triggered model A/B test request. It infers: skill = linear-create, models = glm-5.2 and claude-sonnet-4-6,
        branch = main@bbbbbbb (current, no PR or branch referenced). The agent runs through all phases: inference, confirmation, pre-flight, sync, env setup,
        execute, and report. During execute, the agent invokes the harness twice — once per model — using the same suffixed skill name (skill unchanged
        between model variants). Both invocations use --repeat 3. The agent posts results back to the Slack channel.
      scoring_type: pass_fail
      scoring_criteria:
        # Phase: Variant Inference
        - "Inference: identifies skill = linear-create from the Slack message"
        - "Inference: identifies two models — glm-5.2 and claude-sonnet-4-6"
        - "Inference: no PR or branch referenced — uses current main@bbbbbbb as the skill version"
        - "Ref Resolution: resolves main to bbbbbbb"
        - "Recency: runs recency check for both model combinations"
        - "Confirmation: presents summary showing model dimension and waits for confirmation"
        # Phase: Pre-flight
        - "Pre-flight: fetches and scans skill for self-references"
        # Phase: Sync
        - "Sync: runs dataset_sync.py with --output-manifest"
        # Phase: Env Setup
        - "Env setup: creates a single suffixed skill directory (skill unchanged between model variants)"
        # Phase: Execute
        - "Execute: invokes harness twice — once per model, both with --repeat 3"
        - "Execute: both invocations use the same suffixed skill name (skill unchanged)"
        - "Execute: --model flag differs between invocations"
        - "Execute: experiment names differ only in the model-id segment"
        - "Execute: both runs use the same dataset version timestamp and manifest"
        # Phase: Report
        - "Report: polls for evaluator scores using wait_for_scores.py"
        - "Report: runs eval_report.py with --variants (both model prefixes)"
        - "Report: posts results to the Slack channel"
        # Phase: Cleanup
        - "Cleanup: removes suffixed skill directory"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Pre-flight gate test ───────────────────────────────────────────

  - id: self-reference-abort
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/SKILL.md, linear-create/eval.yaml

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        The agent runs inference and confirmation, then proceeds to pre-flight checks. Pre-flight fetches SKILL.md from both git refs (main@bbbbbbb and
        pr-101@aaaaaaa) and scans for self-references. If a self-reference is detected in the skill body (not frontmatter), the agent aborts the entire
        run before syncing anything to Langfuse or setting up the env. It reports which skill and line(s) contain self-references and tells the user to
        fix the source skill before re-running. If no self-references are found, the agent proceeds normally through sync, env setup, execute, and report.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main@bbbbbbb vs pr-101@aaaaaaa"
        - "Ref Resolution: resolves main to bbbbbbb and PR head to aaaaaaa (via PR API fallback)"
        - "Confirmation: presents summary and waits for confirmation"
        - "Pre-flight: fetches SKILL.md from both git refs via git show"
        - "Pre-flight: scans skill body (not frontmatter) for self-references using word-boundary regex"
        - "Pre-flight: if self-reference detected — aborts the entire run, does not proceed to sync"
        - "Pre-flight: if self-reference detected — does NOT call dataset_sync.py or Langfuse"
        - "Pre-flight: if self-reference detected — reports which skill and line(s) contain self-references"
        - "Pre-flight: if no self-references — proceeds normally through sync, env setup, execute, report"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Phase-targeted edge cases ────────────────────────────────────────

  - id: new-eval-yaml
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml (new file)

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        The agent runs inference, resolves refs (main to bbbbbbb, PR head to aaaaaaa via PR API fallback), and verifies eval.yaml exists at both pinned
        commits. At the base commit (bbbbbbb, before #101 merged), eval.yaml does not exist — the agent excludes the base variant from the matrix (nothing
        to test). Only the after variant (pr-101@aaaaaaa) has eval.yaml, so only that variant is included. The agent runs the recency check, presents a
        confirmation summary noting the excluded base variant, and waits for confirmation. If confirmed, proceeds through sync (after only), env setup,
        execute, and report as a single-variant run.
      scoring_type: pass_fail
      scoring_criteria:
        - "Ref Resolution: resolves main to bbbbbbb and PR head to aaaaaaa (via PR API fallback)"
        - "Ref Resolution: verifies eval.yaml exists at both pinned commits"
        - "Ref Resolution: detects eval.yaml does not exist at base commit bbbbbbb — excludes base variant from matrix"
        - "Inference: only after variant (pr-101@aaaaaaa) has eval.yaml — single-variant run"
        - "Recency: runs recency check for the after variant"
        - "Confirmation: presents summary noting the excluded base variant"
        - "Confirmation: waits for user confirmation"
        - "Sync: syncs only the after version"
        - "Env setup: creates suffixed directory for after variant only"
        - "Execute: invokes eval_harness.py with --repeat 3 for the after variant"
        - "Report: generates standalone report (single variant)"
        - "Cleanup: removes suffixed skill directory"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # PLACEHOLDER: requires a second linear-create PR to exist (not enough commits on main have eval.yaml yet — #101 just added it)
  - id: multi-commit-eval
    input: |
      Repo: example-org/skill-repo
      Branch: main
      Skill: linear-create
      eval.yaml path: linear-create/eval.yaml

      User request: "Run tests for the past 5 commits on the main branch."
    expected_output:
      behavior: |
        # PLACEHOLDER: This test case requires enough commits on main to have eval.yaml.
        # PR #101 just added eval.yaml, so only the most recent 1-2 commits on main have it. Older commits would be excluded.
        # The test case structure is preserved for when enough commits with eval.yaml exist.
        The agent runs variant inference and identifies 5 skill variants — one for each of the last 5 commits on main. The variant labels are the short
        commit hashes. The agent runs the recency check for all 5 variants and presents the variant summary for confirmation.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies 5 skill variants — one per commit from the last 5 commits on main"
        - "Inference: uses short commit hashes as variant labels"
        - "Recency: runs recency check for all 5 variants"
        - "Confirmation: presents variant summary and waits for user confirmation"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  # ─── Report Phase edge cases ───────────────────────────────────────

  - id: report-timeout-partial-scores
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Run tests for this skill."
    expected_output:
      behavior: |
        The agent runs the full pipeline: inference, confirmation, pre-flight, sync, env setup, execute, and report. During the report phase, if
        wait_for_scores.py times out (exit 1, 3-minute timeout) with only partial scores available, the agent proceeds to fetch whatever scores are
        available rather than aborting. It notes the timeout in the report output, runs eval_report.py with the available partial scores, generates a
        verdict based on available deltas, and posts the report. The report explicitly mentions that scoring was incomplete due to a timeout.
      scoring_type: pass_fail
      scoring_criteria:
        - "Inference: identifies skill A/B — main@bbbbbbb vs pr-101@aaaaaaa"
        - "Ref Resolution: resolves main to bbbbbbb and PR head to aaaaaaa (via PR API fallback)"
        - "Confirmation: presents summary and waits for confirmation"
        - "Pre-flight: fetches and scans skill for self-references"
        - "Sync: runs dataset_sync.py with --output-manifest"
        - "Env setup: creates suffixed skill directories"
        - "Execute: invokes eval_harness.py with --repeat 3"
        - "Report: if wait_for_scores.py times out — proceeds with available scores rather than aborting"
        - "Report: notes the timeout in the report output"
        - "Report: runs eval_report.py with available partial scores"
        - "Report: generates a verdict based on available score deltas"
        - "Report: posts results to the originating channel"
        - "Cleanup: removes suffixed skill directories"
      scoring_rules: |
        Score 10 * (passed criteria / total criteria).

  - id: report-single-variant-standalone
    input: |
      PR context:
      - Repo: example-org/skill-repo
      - PR branch: claw/vash/add-eval-yaml-linear-create
      - PR number: 417
      - Base branch: main
      - Files changed: linear-create/eval.yaml

      User request: "Just run tests for the PR version of linear-create — no need to compare against main."
    expected_output:
      behavior: |
        The agent recognizes this is a single-variant run (pr-101@aaaaaaa only, no baseline comparison). It resolves the PR head to aaaaaaa via the
        PR API fallback, verifies eval.yaml exists at that commit, runs the recency check, and presents a confirmation summary. If confirmed, it proceeds
        through pre-flight, sync (after only), env setup, execute (with --repeat 3), and report. During report, it uses standalone report mode
        (--prefix, not --variants), reports per-item scores and dimension breakdowns, and does NOT generate a verdict, deltas, or improvement suggestions.
      scoring_type: pass_fail
      scoring_criteria:
